name: SEMIL Inteligencia Cambial — Intraday

on:
  workflow_dispatch:
  schedule:
    # Brasilia = UTC-3. Atualizacoes intradiarias em dias uteis:
    # 09:15 ate 18:15, a cada hora.
    - cron: '15 12-21 * * 1-5'
    # Fechamento adicional apos o horario de PTAX.
    - cron: '40 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: semil-inteligencia-cambial
  cancel-in-progress: false

jobs:
  inteligencia:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar dados e gerar inteligencia cambial
        run: python intelligence_daily.py

      - name: Salvar PTAX e inteligencia gerada
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json data/market-intelligence.json

          if git diff --cached --quiet; then
            echo "Sem alteracoes para salvar."
            exit 0
          fi

          git commit -m "Atualiza PTAX e inteligencia cambial SEMIL"

          # Protecao contra 'fetch first' caso a main mude enquanto o job roda.
          for tentativa in 1 2 3; do
            echo "Tentativa de sincronizacao $tentativa/3"
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Atualizacao salva com sucesso."
              exit 0
            fi

            sleep $((tentativa * 5))
          done

          echo "Falha ao publicar apos 3 tentativas."
          exit 1
