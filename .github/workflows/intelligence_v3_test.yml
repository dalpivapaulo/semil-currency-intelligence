name: SEMIL Inteligencia Cambial V3 TESTE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inteligencia-v3-teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar inteligencia cambial V3 de teste
        run: python intelligence_daily_v3.py

      - name: Salvar dados V3 de teste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-v3.json data/market-intelligence-v3.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes para salvar."
          else
            git commit -m "Atualiza inteligencia cambial V3 teste"
            git push
          fi
