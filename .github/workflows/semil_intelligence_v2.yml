name: SEMIL Inteligencia Cambial V2

on:
  workflow_dispatch:
  schedule:
    - cron: '40 21 * * 1-5'

permissions:
  contents: write

jobs:
  inteligencia:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar dados e gerar inteligencia cambial
        run: python intelligence_daily.py

      - name: Salvar PTAX e inteligencia gerada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/market-intelligence.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes para salvar."
          else
            git commit -m "Atualiza PTAX e inteligencia cambial SEMIL"
            git push
          fi
